name: Deploy

# Reusable deploy job. Not triggered directly: deploy-dev.yml calls it with
# its inputs, and a prod caller joins it when fjconsulting.io moves.
#
# This is the piece meant to be copied for the next app onboarded under
# fjconsulting.dev. Everything environment-specific arrives as an input, so a
# new project needs its own caller workflow and its own DNS resources,
# not a new pipeline.

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment to deploy into (dev or prod).'
        required: true
        type: string
      project_name:
        description: 'Cloudflare Pages project name.'
        required: true
        type: string
      site_url:
        description: 'Origin this build is served from. Bakes canonical/OG URLs.'
        required: true
        type: string
      indexable:
        description: 'Whether search engines may index this deployment.'
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

# One deploy at a time per environment. Queued rather than cancelled, so a
# deployment already uploading is never left half-applied.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.site_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify colour contrast
        run: node scripts/check-contrast.mjs

      # The build is environment-specific by design: canonical URLs, Open Graph
      # tags and robots.txt all carry the origin. That means dev
      # and prod are rebuilt from the same commit rather than promoting one
      # binary artifact. The commit is the thing promoted, and the tag records
      # exactly which one.
      - name: Build
        env:
          SITE_URL: ${{ inputs.site_url }}
          SITE_INDEXABLE: ${{ inputs.indexable }}
        run: npm run build

      - name: Verify built output
        env:
          SITE_URL: ${{ inputs.site_url }}
          SITE_INDEXABLE: ${{ inputs.indexable }}
        run: node scripts/check-build.mjs

      # `wrangler pages deploy` does NOT create a missing project in CI. Creating
      # one is an interactive prompt, and with no TTY wrangler skips it and exits
      # with "Project not found [code: 8000007]". The original design assumed the
      # first deploy would create the project; it does not, so create it here.
      #
      # This keeps the ownership split intact — GitHub Actions still owns the
      # project, Terraform still owns only DNS and domains, and there is still no
      # create/create race — while making the workflow genuinely copy-pasteable
      # for the next app onboarded under fjconsulting.dev.
      #
      # Idempotent: a 200 means it already exists and nothing is written.
      - name: Ensure the Pages project exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"

          code=$(curl -sS -o /tmp/project.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "${api}/${PROJECT_NAME}")

          if [ "$code" = "200" ]; then
            echo "Pages project '${PROJECT_NAME}' already exists."
            exit 0
          fi

          # Anything other than a clean 404 is a real problem — most likely a
          # token missing Account > Cloudflare Pages > Edit. Fail loudly rather
          # than trying to create over the top of it.
          if [ "$code" != "404" ]; then
            echo "::error::Unexpected HTTP $code looking up Pages project '${PROJECT_NAME}'."
            cat /tmp/project.json
            exit 1
          fi

          echo "Pages project '${PROJECT_NAME}' does not exist. Creating it."
          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${PROJECT_NAME}\",\"production_branch\":\"main\"}" \
            "${api}")

          if [ "$code" != "200" ]; then
            echo "::error::Failed to create Pages project '${PROJECT_NAME}' (HTTP $code)."
            cat /tmp/create.json
            exit 1
          fi

          echo "Created Pages project '${PROJECT_NAME}'."

      - name: Deploy to Cloudflare Pages
        id: deploy
        # v4 runs on Node 24 and, more importantly, defaults to Wrangler v4.
        # v3 silently fell back to its bundled Wrangler 3.90.0, which is what
        # ran here before. wranglerVersion is left unset deliberately: the
        # default tracks Wrangler v4 latest. Pin it if a Wrangler release ever
        # breaks a deploy.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from the repo root so functions/ is discovered relative to CWD
          # when the contact endpoint lands in Phase 3.
          command: >-
            pages deploy dist
            --project-name=${{ inputs.project_name }}
            --branch=main
            --commit-dirty=true

      # Deploying is not the same as working. Fetch the deployment that was
      # just published and assert it actually serves the site.
      #
      # On the first deploy of a new project Cloudflare is still provisioning
      # the *.pages.dev certificate, and losing that race surfaces as a TLS
      # handshake failure rather than an HTTP error:
      #
      #   curl: (35) OpenSSL/3.0.13: error:0A000410:SSL routines::sslv3 alert
      #         handshake failure
      #
      # curl does the waiting itself: --retry-all-errors retries connection and
      # TLS failures as well as HTTP ones, so the window is a few flags rather
      # than a hand-rolled loop. Twenty attempts, 15s apart, capped at five
      # minutes total.
      - name: Smoke-test the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -uo pipefail
          target="${DEPLOY_URL:-https://${PROJECT_NAME}.pages.dev}"
          echo "Smoke-testing ${target}"

          if ! curl -sS --fail \
            --retry 20 --retry-delay 15 --retry-all-errors --retry-max-time 300 \
            --max-time 20 -o /tmp/body.html "${target}"; then
            echo "::error::${target} did not serve HTTP 200 within five minutes."
            exit 1
          fi

          # A 200 only proves something answered. Assert it is actually this site
          # and not an error page or a placeholder.
          for needle in "Cloud, Kubernetes and AI infrastructure" "info@fjconsulting.io"; do
            if ! grep -qF "$needle" /tmp/body.html; then
              echo "::error::Deployed page is missing expected content: $needle"
              exit 1
            fi
          done

          echo "Deployment healthy: ${target}"

      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Deployed to \`${{ inputs.environment }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pages project | \`${{ inputs.project_name }}\` |"
            echo "| Site URL | ${{ inputs.site_url }} |"
            echo "| Deployment URL | ${DEPLOY_URL:-n/a} |"
            echo "| Indexable | \`${{ inputs.indexable }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
