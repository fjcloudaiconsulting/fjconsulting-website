name: CI

# Quality gate for every change. Runs on pull requests and on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Colour tokens are asserted against their WCAG 2.2 requirement. A palette
      # change that drops body text below 4.5:1 fails the build rather than
      # shipping quietly.
      - name: Verify colour contrast
        run: node scripts/check-contrast.mjs

      - name: Type-check and build
        run: npm run build

      # The reveal animation hides content until JS confirms it can animate it
      # back. If that ever regresses, the built HTML is still complete but the
      # page would render blank, so assert the markup carries the real copy.
      - name: Verify built output
        run: node scripts/check-build.mjs
