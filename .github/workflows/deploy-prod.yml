name: Deploy prod

# Production releases are tag-triggered, matching the SemVer convention in
# CLAUDE.md. Promotion is therefore explicit and versioned: main flows
# continuously to dev, and a release is the deliberate act of tagging a commit
# that has already been running there.
#
#   git tag -a v1.0.0 -m "First public release"
#   git push origin v1.0.0
#
# The `prod` GitHub Environment should carry a required-reviewer protection
# rule, which makes the tag push request a release and the approval grant it.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  guard:
    name: Verify the tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A tag pointing at a commit that never reached main would ship something
      # that was never on dev and never reviewed. Refuse it.
      - name: Check tagged commit is an ancestor of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} points at a commit that is not on main. Release only tagged commits that have been merged and deployed to dev."
            exit 1
          fi
          echo "Tagged commit is on main."

  prod:
    needs: guard
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      project_name: fjconsulting-website-prod
      site_url: https://fjconsulting.io
      indexable: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    name: Publish GitHub release
    needs: prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
